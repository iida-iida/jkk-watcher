name: JKK あき家ウォッチャー

on:
  schedule:
    # 【重要】この schedule は "保険" です。あてにしていません。
    # GitHubの定期実行は高負荷時に間引かれ、実測では1日1回ほどしか
    # 起動しませんでした（しかも時刻はバラバラ）。
    # 本番の起動は cron-job.org から workflow_dispatch を叩いて行います。
    # そちらは時刻どおりに動くので、朝9時からの見張りが確実になります。
    # GitHub Actions の時刻指定は UTC です。JST = UTC + 9時間。
    #   UTC 0時 = JST 9時 / UTC 5時 = JST 14時 / 曜日 1-6 = 月曜〜土曜
    - cron: "0 0,5 * * 1-6"
  workflow_dispatch:             # 手動実行ボタンを GitHub の画面に出す

permissions:
  contents: write              # state.json をリポジトリに書き戻すために必要

concurrency:
  group: jkk-watcher           # 前の実行が終わる前に次が走らないようにする
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 1回の起動で最長5時間見張るため長めに取る

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: ブラウザのキャッシュを使う（2回目以降を高速化）
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chromium をインストール
        run: python -m playwright install --with-deps chromium

      - name: 監視スクリプトを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TARGET_BUILDING: コーシャハイム久我山
          TARGET_BUILDING_KANA: コーシャハイムクガヤマ
          # JKKねっとは「URL直接入力」を弾くため、必ず公式ページを経由します
          TARGET_PROPERTY_PAGE: "https://www.to-kousya.or.jp/chintai/reco/kh_kugayama.html"
          HIGHLIGHT_TOU: "D"
          HIGHLIGHT_FLOOR: "4"
          HIGHLIGHT_MADORI: "3LDK"
          # 検索結果の一覧には棟・階が出ないため、面積が本命を見分ける決め手になる
          HIGHLIGHT_AREA: "63.3"
          STRICT_MODE: "false"          # true にすると本命条件の部屋だけ通知
          SEND_DAILY_HEARTBEAT: "false" # true にすると1日1回「稼働中」を通知
          # ↓ 見張りループの設定
          LOOP_MINUTES: "300"            # 1回の起動で見張り続ける時間（分）最大340まで
          CHECK_INTERVAL_MINUTES: "8"    # 何分おきにJKKを確認するか
          ACTIVE_START_HOUR: "9"         # 見張り開始（JST）
          ACTIVE_END_HOUR: "18"          # 見張り終了（JST）
        run: python main.py

      - name: 画面キャプチャを保存（手動実行時・失敗時のみ）
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: debug/
          retention-days: 5
          if-no-files-found: ignore

      # 【2026-09-29 修正】記録の保存で競合しても、記録を失わないようにした。
      # 以前は、別の実行の保存と重なると git が止まり、その実行の記録が
      # まるごと消えていた（9/28 の実行 #42）。
      # 今は「最新の状態を取り直す → 自分の記録を重ねる → 保存」を最大3回試す。
      #   state.json    … この実行の内容で保存する
      #   history.jsonl … 保存済みの行と今回の行を合わせ、重複を除いて時刻順に並べる
      - name: 通知済みリストと観測履歴を保存
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "state.json がまだ作られていないため、保存をスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KEEP=/tmp/keep-$$
          mkdir -p "$KEEP"
          cp -f state.json "$KEEP/state.json"
          if [ -f history.jsonl ]; then cp -f history.jsonl "$KEEP/history.jsonl"; else : > "$KEEP/history.jsonl"; fi
          for i in 1 2 3; do
            if ! git fetch -q origin main; then
              echo "最新の記録を取得できませんでした。少し待って再試行します（${i}/3）"
              sleep 5
              continue
            fi
            git reset -q --hard origin/main
            cp -f "$KEEP/state.json" state.json
            touch history.jsonl
            cat history.jsonl "$KEEP/history.jsonl" | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u | tail -n 3000 > "$KEEP/merged.jsonl" || true
            cp -f "$KEEP/merged.jsonl" history.jsonl
            if [ ! -s history.jsonl ]; then rm -f history.jsonl; fi
            git add state.json
            if [ -f history.jsonl ]; then git add history.jsonl; fi
            if git diff --staged --quiet; then
              echo "変更なし。コミットは不要です。"
              exit 0
            fi
            git commit -q -m "状態を更新 [skip ci]"
            if git push -q origin HEAD:main; then
              echo "保存できました（${i}回目）"
              exit 0
            fi
            echo "保存に失敗。少し待って再試行します（${i}/3）"
            sleep 5
          done
          echo "3回試しても保存できませんでした"
          exit 1
